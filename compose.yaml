# Base stack. Dev additions: compose.override.yaml. Prod additions: compose.prod.yaml.
name: govassist

x-backend-env: &backend-env
  env_file: .env
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend-env
    build: {context: ./backend, target: runtime}
    image: govassist-backend:latest
    command: web
    read_only: true
    tmpfs: [/tmp]

  worker:
    <<: *backend-env
    build: {context: ./backend, target: crawler}
    image: govassist-worker:latest
    command: worker
    volumes: [./data:/data]

  # SPA + reverse proxy on one origin (frontend/nginx/default.conf.template).
  web:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}  # build fails if empty
    image: govassist-web:latest
    environment:
      ADMIN_URL: ${ADMIN_URL:-admin/}
    depends_on:
      backend: {condition: service_healthy}
    init: true
    read_only: true
    # nginx (uid 101) renders its config into conf.d at start and writes pid/temp files.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
