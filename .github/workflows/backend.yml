name: backend

on:
  push:
    branches: [main]
    paths: &paths
      - "backend/**"
      - "compose*.yaml"
      - "tasks.py"
      - ".github/workflows/backend.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes --no-deps -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_DB: govassist
          POSTGRES_USER: govassist
          POSTGRES_PASSWORD: govassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U govassist" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://govassist:govassist@localhost:5432/govassist
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes --no-deps -r requirements/dev.txt
      - run: pytest
      - name: Answer schema is up to date
        run: |
          python -m django export_answer_schema --settings=config.settings.test /tmp/schema
          diff -u ../docs/schema/answer.schema.json /tmp/schema/answer.schema.json
      - name: OpenAPI schema is valid and up to date
        run: |
          python -m django spectacular --settings=config.settings.test --format openapi-json \
            --validate --fail-on-warn --file /tmp/openapi.json
          diff -u ../docs/schema/openapi.json /tmp/openapi.json

  docker:
    runs-on: ubuntu-latest
    env:
      MAX_RUNTIME_MB: 300
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          tags: govassist-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build crawler
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: crawler
          tags: govassist-worker:ci
          load: true
          cache-from: type=gha
      - name: Runtime image size ≤ ${{ env.MAX_RUNTIME_MB }} MB
        run: |
          size=$(docker image inspect govassist-backend:ci --format '{{.Size}}')
          mb=$((size / 1000 / 1000))
          echo "runtime image: ${mb} MB"
          test "$mb" -le "$MAX_RUNTIME_MB"
      - name: Web image never imports crawler-only modules
        run: |
          docker run --rm -e SECRET_KEY=ci -e DATABASE_URL=postgres://ci@localhost/ci \
            -e REDIS_URL=redis://localhost:6379/0 -e ALLOWED_HOSTS=ci \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod govassist-backend:ci \
            python -c "import django; django.setup(); from django.urls import get_resolver; get_resolver().url_patterns; import apps.collector.tasks, apps.corpus.tasks"
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: govassist-backend:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
