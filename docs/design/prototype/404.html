<script>
  /* Prototype only: show the elements whose data-when lists the current state (#state in the URL). */
  (function () {
    var bar = document.querySelector(".proto-bar");
    function show(state) {
      document.querySelectorAll("[data-when]").forEach(function (el) {
        el.hidden = el.getAttribute("data-when").split(" ").indexOf(state) < 0;
      });
      bar.querySelectorAll("[data-state]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-state") === state));
      });
      document.body.classList.toggle("drawer-open", state.indexOf("drawer") === 0);
      if (window.GovAssistLang) window.GovAssistLang.closeAll();
      if (window.GovAssistLang && state === "lang-open") {
        var m = document.querySelector('[data-when~="lang-open"]:not([hidden]) [data-lang-menu]');
        if (m) window.GovAssistLang.open(m);
      }
      if (window.GovAssistLang && /^(default|uz-Cyrl|ru|en)$/.test(state)) {
        window.GovAssistLang.set(state === "default" ? "uz-Latn" : state, { instant: true });
      }
    }
    function current() {
      var h = location.hash.slice(1);
      var known = Array.prototype.map.call(bar.querySelectorAll("[data-state]"), function (b) { return b.getAttribute("data-state"); });
      return known.indexOf(h) >= 0 ? h : bar.getAttribute("data-default");
    }
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-state], [data-goto], [data-drawer]");
      if (!t) return;
      e.preventDefault();
      if (t.hasAttribute("data-drawer")) {
        document.body.classList.toggle("drawer-open", t.getAttribute("data-drawer") === "open");
        return;
      }
      location.hash = t.getAttribute("data-state") || t.getAttribute("data-goto");
    });
    window.addEventListener("hashchange", function () { show(current()); });
    show(current());
  })();
</script>
