<!doctype html>
<html lang="uz-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 / error · GovAssist prototype</title>
  <link rel="stylesheet" href="../fonts/inter.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="proto.css">
</head>
<body>
<nav class="proto-bar" aria-label="Prototype states" data-default="not-found"><a href="index.html">← Index</a><span>States:</span><button type="button" data-state="not-found" aria-pressed="false">404</button><button type="button" data-state="error" aria-pressed="false">generic error</button></nav>
<div class="auth">
  <header class="auth__header"><a class="wordmark" href="login.html"><span class="wordmark__mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>GovAssist</a><div class="lang-switch"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><label class="sr-only" for="lang">Til</label><select class="select" id="lang"><option selected>Oʻzbekcha (lotin)</option><option>Ўзбекча (кирилл)</option><option>Русский</option><option>English</option></select></div></header>
  <main class="auth__main" id="main">
<div data-when="not-found"><div class="center-state"><div class="center-state__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z"/></svg></div><h1>Sahifa topilmadi</h1><p class="t-body-lg t-muted">Havola notoʻgʻri yoki sahifa olib tashlangan.</p><a class="btn btn--primary" href="chat-empty.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6a2 2 0 0 1 .7 1.5v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Bosh sahifaga qaytish</span></a></div></div><div data-when="error"><div class="center-state" role="alert"><div class="center-state__icon center-state__icon--danger"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div><h1>Nimadir buzildi</h1><p class="t-body-lg t-muted">Sahifani yangilang. Muammo takrorlansa, birozdan soʻng qayta kiring.</p><button class="btn btn--primary" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.7-2.7L3 16"/><path d="M8 16H3v5"/></svg><span>Sahifani yangilash</span></button><a class="btn btn--ghost" href="chat-empty.html"><span>Bosh sahifaga qaytish</span></a></div></div>
  </main>
  <footer class="auth__footer"><p class="footer-note">Rasmiy davlat xizmati emas</p><nav class="footer-links" aria-label="Footer"><a href="about.html">Loyiha haqida</a><a href="about.html#privacy">Maxfiylik haqida</a></nav></footer>
</div>
<script>
  /* Prototype only: show the elements whose data-when lists the current state (#state in the URL). */
  (function () {
    var bar = document.querySelector(".proto-bar");
    function show(state) {
      document.querySelectorAll("[data-when]").forEach(function (el) {
        el.hidden = el.getAttribute("data-when").split(" ").indexOf(state) < 0;
      });
      bar.querySelectorAll("[data-state]").forEach(function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-state") === state));
      });
      document.body.classList.toggle("drawer-open", state.indexOf("drawer") === 0);
    }
    function current() { return location.hash.slice(1) || bar.getAttribute("data-default"); }
    document.addEventListener("click", function (e) {
      var t = e.target.closest("[data-state], [data-goto], [data-drawer]");
      if (!t) return;
      e.preventDefault();
      if (t.hasAttribute("data-drawer")) {
        document.body.classList.toggle("drawer-open", t.getAttribute("data-drawer") === "open");
        return;
      }
      location.hash = t.getAttribute("data-state") || t.getAttribute("data-goto");
    });
    window.addEventListener("hashchange", function () { show(current()); });
    show(current());
  })();
</script>
</body>
</html>
