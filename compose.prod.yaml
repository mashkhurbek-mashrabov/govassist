# Prod: `docker compose -f compose.yaml -f compose.prod.yaml --profile tunnel up -d`.
# Public traffic: Cloudflare Tunnel (`cloudflared`, profile `tunnel`) → http://web:8080, so the
# server needs no open ports or certificates. Without the profile, a host's main nginx can proxy
# to WEB_PUBLISH instead (deploy/nginx/govassist.conf). db, redis, backend and worker publish
# nothing and stay on the project's private network.
x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    <<: *prod
    deploy: {resources: {limits: {cpus: "1.0", memory: 1g}}}

  redis:
    <<: *prod
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}

  backend:
    <<: *prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      ENVIRONMENT_NAME: PROD
    deploy: {resources: {limits: {cpus: "1.0", memory: 768m}}}

  worker:
    <<: *prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      ENVIRONMENT_NAME: PROD
    deploy: {resources: {limits: {cpus: "1.0", memory: 1g}}}

  web:
    <<: *prod
    ports: ["${WEB_PUBLISH:-127.0.0.1:8015}:8080"]
    deploy: {resources: {limits: {cpus: "0.5", memory: 128m}}}

  # Tunnel public hostname → HTTP web:8080 (set in the Cloudflare dashboard), never the backend.
  cloudflared:
    <<: *prod
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    deploy: {resources: {limits: {cpus: "0.5", memory: 128m}}}
