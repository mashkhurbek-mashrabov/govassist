# Prod: `docker compose -f compose.yaml -f compose.prod.yaml up -d`.
# Only `web` (nginx) publishes a port (WEB_PUBLISH, default 127.0.0.1:8015). The host's main
# nginx terminates TLS and proxies to it (deploy/nginx/govassist.conf). db, redis, backend and
# worker stay on the project's private network.
x-prod: &prod
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  db:
    <<: *prod
    deploy: {resources: {limits: {cpus: "1.0", memory: 1g}}}

  redis:
    <<: *prod
    deploy: {resources: {limits: {cpus: "0.5", memory: 256m}}}

  backend:
    <<: *prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      ENVIRONMENT_NAME: PROD
    deploy: {resources: {limits: {cpus: "1.0", memory: 768m}}}

  worker:
    <<: *prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "false"
      ENVIRONMENT_NAME: PROD
    deploy: {resources: {limits: {cpus: "1.0", memory: 1g}}}

  web:
    <<: *prod
    ports: ["${WEB_PUBLISH:-127.0.0.1:8015}:8080"]
    deploy: {resources: {limits: {cpus: "0.5", memory: 128m}}}
