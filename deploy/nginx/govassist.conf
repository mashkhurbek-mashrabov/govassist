# Main (host) nginx → GovAssist web container. Copy to the main nginx, set the certificate
# paths and the upstream, then `nginx -t && systemctl reload nginx`.
#
# Upstream: the GovAssist server's address and WEB_PUBLISH port (devbox1 LAN IP shown).
# TLS ends here (or at Cloudflare). The web container gets plain HTTP plus the headers below.
server {
    listen 443 ssl;
    http2 on;
    server_name govassist.mashkhurbek.uz;

    ssl_certificate     /etc/ssl/govassist/fullchain.pem;
    ssl_certificate_key /etc/ssl/govassist/privkey.pem;

    location / {
        proxy_pass http://192.168.100.80:8015;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Django builds https URLs (Google redirect_uri, CSRF origin) from this.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Chat answers stream over SSE: never buffer, allow long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
