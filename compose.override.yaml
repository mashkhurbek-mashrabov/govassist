# Dev: live code, auto-reload, host ports.
services:
  db:
    ports: ["127.0.0.1:${DB_HOST_PORT:-5432}:5432"]

  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]

  backend:
    volumes: [./backend:/app]
    environment: {DJANGO_RELOAD: "true"}
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8000}:${PORT:-8000}"]

  worker:
    volumes: [./backend:/app, ./data:/data]
    environment: {DJANGO_RELOAD: "true"}
